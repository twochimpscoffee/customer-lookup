<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Lookup</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <header>
    <div class="brand">Two Chimps · Customer Lookup</div>
    <div id="order" class="order"></div>
  </header>

  <details id="searchBox">
    <summary>Search manually</summary>
    <form id="searchForm">
      <input id="qName" placeholder="Name" autocomplete="off">
      <input id="qEmail" placeholder="Email" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </details>

  <div id="banner" class="banner hidden"></div>
  <div id="candidates"></div>
  <div id="editor" class="hidden"></div>

  <footer id="foot"></footer>

  <script src="config.js"></script>
  <script src="match.js"></script>
  <script src="parse.js"></script>
  <script src="auth.js"></script>
  <script src="graph.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
